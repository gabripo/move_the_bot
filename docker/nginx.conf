# Docker's DNS, so nginx starts even when an optional service (speech) is not running.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location /vendor/ {
        root /usr/share/nginx/html;
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # 3D models of the objects: shipped ones and downloaded ones.
    location /models/ {
        alias /models/;
        add_header Cache-Control "no-cache";
    }

    # Browser <-> ROS (rosbridge websocket).
    location /ws/ {
        set $ros http://robot:9090;
        proxy_pass $ros/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Optional local speech-to-text (./run.sh --voice).
    location /scan/ {
        set $scan http://scan:8000;
        rewrite ^/scan/(.*)$ /$1 break;
        proxy_pass $scan;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }
    location /stt/ {
        set $stt http://stt:8000;
        rewrite ^/stt/(.*)$ /$1 break;
        proxy_pass $stt;
        proxy_read_timeout 120;
    }
}

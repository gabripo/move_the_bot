# Used by MoveIt tools such as the RViz drag marker. The arm has 5 joints, so the generic solver
# can only match a position, not a full orientation. The skill server uses its own solver
# (move_the_bot/kinematics.py), which also controls how steeply the gripper points down.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true

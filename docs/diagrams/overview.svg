<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>move_the_bot: system overview</title>
  <desc>The browser, the Docker containers on the laptop, the language model on a GPU PC in the home network, and what ros2_control drives.</desc>
  <style>
    .t { fill: #1f2933; font-size: 13px; }
    .s { fill: #52606d; font-size: 12px; }
    .b { font-weight: 600; }
    .h { fill: #1f2933; font-size: 15px; font-weight: 700; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #52606d; }
    .flow { stroke: #3e4c59; stroke-width: 1.6; fill: none; }
    .opt { stroke: #7b8794; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3e4c59"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect width="1200" height="770" rx="16" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#1f2933">move_the_bot · system overview</text>
  <text x="30" y="68" class="s" font-size="14">The robot stack runs in Docker on a laptop. The language model runs on a GPU PC in the same home network.</text>

  <!-- Laptop -->
  <rect x="30" y="90" width="760" height="626" rx="14" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="50" y="116" class="h">Laptop or desktop</text>
  <text x="50" y="134" class="s">macOS, Linux or Windows (the author uses a MacBook Air)</text>

  <!-- Browser -->
  <rect x="50" y="148" width="720" height="114" rx="10" fill="#e8f1fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="66" y="170" class="t b">Browser · Chrome or Edge</text>
  <text x="240" y="170" class="mono">http://localhost:8080</text>
  <g>
    <rect x="66" y="182" width="162" height="70" rx="8" fill="#ffffff" stroke="#a3c4ec"/>
    <text x="78" y="202" class="t b">3D view</text>
    <text x="78" y="220" class="s">three.js draws the</text>
    <text x="78" y="236" class="s">robot from its URDF</text>
    <rect x="242" y="182" width="162" height="70" rx="8" fill="#ffffff" stroke="#a3c4ec"/>
    <text x="254" y="202" class="t b">Commands</text>
    <text x="254" y="220" class="s">typed, or spoken via</text>
    <text x="254" y="236" class="s">Web Speech API</text>
    <rect x="418" y="182" width="162" height="70" rx="8" fill="#ffffff" stroke="#a3c4ec"/>
    <text x="430" y="202" class="t b">Hand tracking</text>
    <text x="430" y="220" class="s">MediaPipe, running</text>
    <text x="430" y="236" class="s">inside the browser</text>
    <rect x="594" y="182" width="162" height="70" rx="8" fill="#ffffff" stroke="#a3c4ec"/>
    <text x="606" y="202" class="t b">Webcam + mic</text>
    <text x="606" y="220" class="s">the video never</text>
    <text x="606" y="236" class="s">leaves this computer</text>
  </g>

  <!-- Browser to web -->
  <path d="M216 262 L216 327" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="226" y="281" class="s">page + websocket (rosbridge JSON)</text>

  <!-- Docker -->
  <rect x="50" y="290" width="720" height="410" rx="10" fill="#eef7f4" stroke="#2f8f72" stroke-width="1.5"/>
  <text x="66" y="312" class="t b" fill="#1f6f58">Docker Compose</text>

  <!-- web container -->
  <rect x="66" y="330" width="200" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="80" y="352" class="t b">web · nginx</text>
  <text x="80" y="372" class="s">serves the page on 8080</text>
  <text x="80" y="390" class="mono">/ws/  → robot:9090</text>
  <text x="80" y="408" class="mono">/stt/ → stt:8000</text>

  <!-- optional containers -->
  <path d="M166 430 L166 447" class="opt" marker-end="url(#ag)"/>
  <rect x="66" y="450" width="200" height="100" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="80" y="474" class="t b">stt · Whisper</text>
  <text x="80" y="494" class="s">optional: ./run.sh --voice</text>
  <text x="80" y="512" class="s">speech-to-text on this</text>
  <text x="80" y="528" class="s">computer instead of the cloud</text>

  <rect x="66" y="570" width="200" height="100" rx="8" fill="#ffffff" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="80" y="594" class="t b">ollama · small model</text>
  <text x="80" y="614" class="s">optional, on the CPU:</text>
  <text x="80" y="632" class="s">used when no OLLAMA_URL</text>
  <text x="80" y="648" class="s">points elsewhere</text>
  <path d="M302 438 L276 438 L276 620 L269 620" class="opt" marker-end="url(#ag)"/>

  <!-- robot container -->
  <rect x="286" y="330" width="470" height="354" rx="8" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/>
  <text x="302" y="352" class="t b">robot · ROS 2 Jazzy</text>
  <text x="740" y="352" class="s" text-anchor="end">one container, many nodes</text>

  <path d="M266 386 L300 386" class="flow" marker-end="url(#a)"/>

  <g>
    <rect x="302" y="366" width="438" height="40" rx="6" fill="#ffffff" stroke="#e3c46b"/>
    <text x="316" y="391" class="t b">rosbridge</text>
    <text x="440" y="391" class="s">websocket ↔ ROS topics, port 9090</text>
    <path d="M521 406 L521 417" class="flow" marker-end="url(#a)"/>

    <rect x="302" y="418" width="438" height="40" rx="6" fill="#ffffff" stroke="#e3c46b"/>
    <text x="316" y="443" class="t b">agent</text>
    <text x="440" y="443" class="s">rules first, language model if needed</text>
    <path d="M521 458 L521 469" class="flow" marker-end="url(#a)"/>

    <rect x="302" y="470" width="438" height="40" rx="6" fill="#ffffff" stroke="#e3c46b"/>
    <text x="316" y="495" class="t b">skill_server</text>
    <text x="440" y="495" class="s">inverse kinematics, world model, teleop</text>
    <path d="M521 510 L521 521" class="flow" marker-end="url(#a)"/>

    <rect x="302" y="522" width="438" height="40" rx="6" fill="#ffffff" stroke="#e3c46b"/>
    <text x="316" y="547" class="t b">move_group</text>
    <text x="440" y="547" class="s">MoveIt 2: collision-free plans</text>
    <path d="M521 562 L521 573" class="flow" marker-end="url(#a)"/>

    <rect x="302" y="574" width="438" height="40" rx="6" fill="#ffffff" stroke="#e3c46b"/>
    <text x="316" y="599" class="t b">ros2_control</text>
    <text x="440" y="599" class="s">arm + gripper controllers, 100 Hz</text>
    <path d="M521 614 L521 625" class="flow" marker-end="url(#a)"/>

    <rect x="302" y="626" width="438" height="40" rx="6" fill="#ffffff" stroke="#e3c46b"/>
    <text x="316" y="651" class="t b">hardware plugin</text>
    <text x="440" y="651" class="mono">mock · isaac · real</text>
  </g>

  <!-- GPU PC -->
  <rect x="820" y="90" width="350" height="228" rx="14" fill="#f4effc" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="840" y="116" class="h">GPU PC in the home network</text>
  <text x="840" y="134" class="s">Bazzite Linux, set up with ollama-server.sh</text>
  <rect x="840" y="148" width="310" height="124" rx="8" fill="#ffffff" stroke="#b69cf0" stroke-width="1.3"/>
  <text x="854" y="172" class="t b">Ollama · official ROCm container</text>
  <text x="854" y="194" class="s">qwen2.5 14B instruct, Q4_K_M</text>
  <text x="854" y="214" class="s">AMD Radeon RX 9070 XT, 16 GB, all on the GPU</text>
  <text x="854" y="234" class="s">about 1 s per free-form request</text>
  <text x="854" y="254" class="mono">port 11434, home network only</text>
  <text x="840" y="300" class="s" font-style="italic">asked only when the rules do not understand</text>

  <path d="M740 438 L800 438 L800 218 L837 218" class="flow" marker-end="url(#a)"/>

  <!-- cloud alternative -->
  <rect x="820" y="352" width="350" height="76" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="840" y="376" class="t b">or a cloud API</text>
  <text x="840" y="396" class="s">NVIDIA NIM, or any OpenAI-compatible</text>
  <text x="840" y="413" class="s">endpoint (LLM_BACKEND=openai)</text>
  <path d="M800 390 L817 390" class="opt" marker-end="url(#ag)"/>

  <!-- hardware -->
  <rect x="820" y="450" width="350" height="266" rx="14" fill="#fdf1ec" stroke="#dd6b4d" stroke-width="1.5"/>
  <text x="840" y="476" class="h">What ros2_control drives</text>
  <text x="840" y="494" class="mono">hardware:=mock | isaac | real</text>
  <rect x="840" y="504" width="310" height="60" rx="8" fill="#ffffff" stroke="#efa58f"/>
  <text x="854" y="524" class="t b">mock · the default</text>
  <text x="854" y="541" class="s">a simulated arm inside the robot</text>
  <text x="854" y="556" class="s">container, nothing else needed</text>
  <rect x="840" y="572" width="310" height="60" rx="8" fill="#ffffff" stroke="#efa58f" stroke-dasharray="5 4"/>
  <text x="854" y="592" class="t b">Isaac Sim</text>
  <text x="854" y="609" class="s">a PC with an NVIDIA RTX GPU; joint</text>
  <text x="854" y="624" class="s">commands and states on ROS topics</text>
  <rect x="840" y="640" width="310" height="60" rx="8" fill="#ffffff" stroke="#efa58f" stroke-dasharray="5 4"/>
  <text x="854" y="660" class="t b">real SO-101</text>
  <text x="854" y="677" class="s">Feetech servos on USB serial,</text>
  <text x="854" y="692" class="s">with a calibration file</text>

  <path d="M740 646 L817 646" class="flow" marker-end="url(#a)"/>

  <!-- legend -->
  <path d="M30 746 L70 746" class="flow"/>
  <text x="78" y="750" class="s">the setup shown</text>
  <path d="M170 746 L210 746" class="opt"/>
  <text x="218" y="750" class="s">optional, or an alternative</text>
</svg>

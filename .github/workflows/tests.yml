name: Tests

# 1. Unit tests: language rules, world model, kinematics, LLM parsing (no ROS needed).
# 2. End-to-end: the real containers. MoveIt plans, ros2_control executes, the browser drives.
on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/media/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests pytest fastapi httpx python-multipart   # the last three: the scan server
      - run: python -m pytest tests/unit -v

  end-to-end:
    name: End-to-end (ROS 2 + MoveIt + browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OLLAMA_URL: http://127.0.0.1:9     # no language model in CI: the built-in rules are tested
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: docker compose build robot web

      - name: Start the robot and the web app
        run: docker compose up -d robot web

      - name: Robot test (skills, agent, teleoperation)
        run: docker compose exec -T robot /ros_entrypoint.sh pytest -v -p no:cacheprovider /ros_ws/tests/e2e/test_robot.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The optional object scanner, with a fixed synthetic splat instead of Idol (no GPU here).
      - name: Start the object scanner
        run: |
          python3 tests/e2e/make_test_splat.py test-splat.ply
          docker compose cp test-splat.ply robot:/models/cache/test-splat.ply
          IDOL_BACKEND=file IDOL_FILE=/models/cache/test-splat.ply docker compose --profile scan up -d --build scan

      - name: Browser test
        working-directory: tests/e2e
        env:
          CHECK_HAND_TRACKING: '1'
          CHECK_SCAN: '1'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node browser_test.mjs

      # The same stack with the Isaac Sim hardware interface: joint commands go out on a topic,
      # joint states come back on another. A small node stands in for Isaac Sim.
      - name: Isaac Sim interface test (topic-based hardware)
        run: |
          docker compose --profile scan down
          HARDWARE=isaac docker compose up -d robot
          docker compose exec -d robot /ros_entrypoint.sh ros2 run move_the_bot joint_echo
          docker compose exec -T robot /ros_entrypoint.sh pytest -v -p no:cacheprovider /ros_ws/tests/e2e/test_robot.py \
            -k "starts_at_home or pick_and_place or stack_one or plans_around or teleoperation_grabs"

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 400
